cargo-features = ["profile-rustflags"]

[package]
name = "hearth"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
# gix = { version = "0.76.0", default-features = false }

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.debugging]
inherits = "dev"
debug = false
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[profile.dev.build-override]
opt-level = 0
codegen-units = 16
debug = false # when possible

[profile.release.build-override]
opt-level = 0
codegen-units = 16
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
